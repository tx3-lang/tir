name: Publish crate

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.91

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Validate tag matches workspace version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          WORKSPACE_VERSION="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')"
          if [ "$TAG_VERSION" != "$WORKSPACE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match Cargo workspace version ($WORKSPACE_VERSION)."
            exit 1
          fi

      - name: Publish to crates.io
        run: cargo publish --locked -p tx3-tir
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
