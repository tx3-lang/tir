[workspace]
resolver = "2"
members = ["crates/tx3-tir"]

[workspace.package]
publish = true
authors = ["TxPipe"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/tx3-lang/tir"
homepage = "https://github.com/tx3-lang/tir"
documentation = "https://docs.rs/tx3-tir"
version = "0.18.0"
keywords = ["blockchain", "cardano", "utxo", "dsl"]
readme = "README.md"

[workspace.dependencies]
thiserror = "2.0.11"
hex = "0.4.3"
serde = { version = "1.0.217", features = ["derive"] }
